name: Deploy to GCP VM (Service Account Based)

on:
  push:
    branches:
      - main
      - dev-1
      - dev-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Set Environment Variables
        run: |
          if [[ "${{ github.ref_name }}" == "dev-3" ]]; then
            echo "INSTANCE_IP=${{ secrets.VM_IP_PROD }}" >> $GITHUB_ENV
            echo "DOMAIN=${{ secrets.DOMAIN_PROD }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "dev-1" ]]; then
            echo "INSTANCE_IP=${{ secrets.VM_IP_DEV_1 }}" >> $GITHUB_ENV
            echo "DOMAIN=${{ secrets.DOMAIN_DEV_1 }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "dev-2" ]]; then
            echo "INSTANCE_IP=${{ secrets.VM_IP_DEV_2 }}" >> $GITHUB_ENV
            echo "DOMAIN=${{ secrets.DOMAIN_DEV_2 }}" >> $GITHUB_ENV
          fi

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.INSTANCE_IP }}
          username: deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/CLIMB
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            # Ganti placeholder __DOMAIN__ dengan domain asli
            sed -i "s/__DOMAIN__/${{ env.DOMAIN }}/g" backend/nginx.conf
            
            cd backend
            docker compose up --build -d

