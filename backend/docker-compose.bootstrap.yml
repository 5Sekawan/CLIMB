services:
  mongodb:
    image: mongo:latest
    container_name: climb-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    networks:
      - climb-network

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: climb-backend
    expose:
      - "8080"
    env_file:
      - .env
    volumes:
      - ./config/gcp-service-account.json:/app/config/gcp-service-account.json:ro
    depends_on:
      - mongodb
    networks:
      - climb-network

  nginx:
    image: nginx:alpine
    container_name: climb-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend-api
    networks:
      - climb-network

  certbot:
    image: certbot/certbot
    container_name: climb-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:rw
    networks:
      - climb-network

networks:
  climb-network:
    driver: bridge

volumes:
  mongodb_data:
