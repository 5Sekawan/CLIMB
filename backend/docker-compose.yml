services:
  mongodb:
    image: mongo:latest
    container_name: climb-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123 # Disarankan diganti via Env Secrets di VM
    networks:
      - climb-network

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: climb-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32G
        reservations:
          memory: 4G
    expose:
      - "8080"
    env_file:
      - .env
    volumes:
      - ./config/gcp-service-account.json:/app/config/gcp-service-account.json:ro
    depends_on:
      - mongodb
    networks:
      - climb-network

  nginx:
    image: nginx:alpine
    container_name: climb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend-api
    networks:
      - climb-network

  certbot:
    image: certbot/certbot
    container_name: climb-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - climb-network

networks:
  climb-network:
    driver: bridge

volumes:
  mongodb_data:
